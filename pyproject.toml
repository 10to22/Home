[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phrasehome"
version = "0.1.0"
description = "Always-listening, wake-word-free voice commands for Google Home"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "rapidfuzz>=3",
    "requests>=2.28",
    "numpy>=1.24",
]

[project.optional-dependencies]
audio = ["vosk>=0.3.44", "sounddevice>=0.4"]  # 0.3.45 has no Mac build
google = ["gassist-text>=0.1.0", "google-auth-oauthlib>=1.0"]
vision = ["opencv-python-headless>=4.8,<5", "numpy>=1.24"]  # OpenCV 5 dropped the Caffe loader the camera detector uses
ai = ["anthropic>=0.100", "ddgs>=9"]  # ddgs: web search for the local AI
voice = ["piper-tts>=1.2"]
whisper = ["faster-whisper>=1.0"]  # settings: recognizer: whisper (far more accurate hearing)
wake = ["openwakeword>=0.6"]  # settings: wake_engine: openwakeword (a real "hey home" detector)
calendar = ["icalendar>=5", "recurring-ical-events>=2"]
all = ["phrasehome[audio,google,vision,ai,voice,calendar,whisper]"]
dev = ["pytest>=7", "numpy>=1.24"]

[project.scripts]
phrasehome = "phrasehome.cli:main"

[tool.setuptools.packages.find]
include = ["phrasehome*"]

[tool.setuptools.package-data]
phrasehome = ["*.json"]
