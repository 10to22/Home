[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phrasehome"
version = "0.1.0"
description = "Always-listening, wake-word-free voice commands for Google Home"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "rapidfuzz>=3",
    "requests>=2.28",
]

[project.optional-dependencies]
audio = ["vosk>=0.3.45", "sounddevice>=0.4"]
google = ["gassist-text>=0.1.0", "google-auth-oauthlib>=1.0"]
vision = ["opencv-python-headless>=4.8", "numpy>=1.24"]
ai = ["anthropic>=0.100"]
voice = ["piper-tts>=1.2"]
all = ["phrasehome[audio,google,vision,ai,voice]"]
dev = ["pytest>=7", "numpy>=1.24"]

[project.scripts]
phrasehome = "phrasehome.cli:main"

[tool.setuptools.packages.find]
include = ["phrasehome*"]
